name: Android Build

on:
  push:
    branches:
      - main
      - add-feature
      - 'feature/**'
    tags:
      - 'v*-libass.*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Prerelease tag (leave empty to generate one from the app version)'
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          gradle-home-cache-cleanup: true

      - name: Run Local Tests
        run: ./gradlew test

      - name: Lint Checks
        run: ./gradlew ktlintCheck

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: '**/build/reports/**'
          if-no-files-found: ignore

  build:
    name: Build ${{ matrix.abi }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          gradle-home-cache-cleanup: true

      - name: Build optimized ${{ matrix.abi }} APK
        run: ./gradlew 'assembleRelease-with-debug-signing' -PtargetAbi=${{ matrix.abi }}

      - name: Prepare release filename
        run: |
          cp \
            app/build/outputs/apk/release-with-debug-signing/app-${{ matrix.abi }}-release-with-debug-signing.apk \
            app/build/outputs/apk/release-with-debug-signing/app-${{ matrix.abi }}-release.apk

      - name: Upload ${{ matrix.abi }} APK
        uses: actions/upload-artifact@v7
        with:
          name: nextplayer-${{ matrix.abi }}-release
          path: app/build/outputs/apk/release-with-debug-signing/app-${{ matrix.abi }}-release.apk
          if-no-files-found: error

  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve prerelease tag
        id: release_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${EVENT_NAME}" == "push" ]]; then
            release_tag="${REF_NAME}"
          elif [[ -n "${REQUESTED_TAG}" ]]; then
            release_tag="${REQUESTED_TAG}"
          else
            app_version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
            release_tag="v${app_version}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Download ABI APKs
        uses: actions/download-artifact@v8
        with:
          pattern: nextplayer-*-release
          path: release-artifacts
          merge-multiple: true

      - name: Create draft release and upload APKs
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.value }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: release-artifacts/*.apk

      - name: Publish immutable prerelease
        run: gh release edit "${RELEASE_TAG}" --draft=false --prerelease --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
